plugins {
    id "com.android.application"
}

ext {
    // The packageVariant defines the bootstrap variant that will be included in the app APK.
    // This must be supported by com.termux.shared.termux.TermuxBootstrap.PackageVariant or app will
    // crash at startup.
    // Bootstrap of a different variant must not be manually installed by the user after app installation
    // by replacing $PREFIX since app code is dependant on the variant used to build the APK.
    // Currently supported values are: [ "apt-android-7" "apt-android-5" ]
    packageVariant = System.getenv("TERMUX_PACKAGE_VARIANT") ?: "apt-android-7" // Default: "apt-android-7"
    bootstrapMinSdk = packageVariant == "apt-android-5" ? 21 : 24
    bootstrapMinRelease = packageVariant == "apt-android-5" ? "5.0" : "7.0"
    bootstrapMaxSdk = packageVariant == "apt-android-5" ? 23 : 0
    bootstrapMaxRelease = packageVariant == "apt-android-5" ? "6.0" : ""
}

android {
    namespace "com.termux"

    compileSdkVersion project.properties.compileSdkVersion.toInteger()
    ndkVersion = System.getenv("JITPACK_NDK_VERSION") ?: project.properties.ndkVersion
    def appVersionName = System.getenv("TERMUX_APP_VERSION_NAME") ?: ""
    def apkVersionTag = System.getenv("TERMUX_APK_VERSION_TAG") ?: ""
    def splitAPKsForDebugBuilds = System.getenv("TERMUX_SPLIT_APKS_FOR_DEBUG_BUILDS") ?: "1"
    def splitAPKsForReleaseBuilds = System.getenv("TERMUX_SPLIT_APKS_FOR_RELEASE_BUILDS") ?: "1"

    dependencies {
        implementation "androidx.annotation:annotation:1.11.0"
        implementation "androidx.core:core:1.13.1"
        implementation "androidx.drawerlayout:drawerlayout:1.2.0"
        implementation "androidx.preference:preference:1.2.1"
        implementation "androidx.viewpager:viewpager:1.1.0"
        implementation "com.google.android.material:material:1.14.0"
        implementation "com.google.guava:guava:33.7.2-android"
        implementation "io.noties.markwon:core:$markwonVersion"
        implementation "io.noties.markwon:ext-strikethrough:$markwonVersion"
        implementation "io.noties.markwon:linkify:$markwonVersion"
        implementation "io.noties.markwon:recycler:$markwonVersion"
        implementation 'com.google.guava:listenablefuture:9999.0-empty-to-avoid-conflict-with-guava'

        implementation project(":terminal-view")
        implementation project(":termux-shared")
        implementation project(":x11")
    }

    defaultConfig {
        minSdkVersion project.properties.minSdkVersion.toInteger()
        targetSdkVersion project.properties.targetSdkVersion.toInteger()
        versionCode 118
        versionName "0.118.0"

        if (appVersionName) versionName = appVersionName
        validateVersionName(versionName)

        applicationId "com.termux"

        buildConfigField "String", "TERMUX_PACKAGE_VARIANT", "\"" + project.ext.packageVariant + "\"" // Used by TermuxApplication class
        buildConfigField "int", "TERMUX_APP__BOOTSTRAP_MIN_SDK", "" + project.ext.bootstrapMinSdk
        buildConfigField "String", "TERMUX_APP__BOOTSTRAP_MIN_RELEASE", "\"" + project.ext.bootstrapMinRelease + "\""
        buildConfigField "int", "TERMUX_APP__BOOTSTRAP_MAX_SDK", "" + project.ext.bootstrapMaxSdk
        buildConfigField "String", "TERMUX_APP__BOOTSTRAP_MAX_RELEASE", "\"" + project.ext.bootstrapMaxRelease + "\""

        manifestPlaceholders.TERMUX_PACKAGE_NAME = "com.termux"
        manifestPlaceholders.TERMUX_APP_NAME = "Modern Termux"
        manifestPlaceholders.TERMUX_API_APP_NAME = "Termux:API"
        manifestPlaceholders.TERMUX_BOOT_APP_NAME = "Termux:Boot"
        manifestPlaceholders.TERMUX_FLOAT_APP_NAME = "Termux:Float"
        manifestPlaceholders.TERMUX_STYLING_APP_NAME = "Termux:Styling"
        manifestPlaceholders.TERMUX_TASKER_APP_NAME = "Termux:Tasker"
        manifestPlaceholders.TERMUX_WIDGET_APP_NAME = "Termux:Widget"

        externalNativeBuild {
            ndkBuild {
                cFlags "-std=c11", "-Wall", "-Wextra", "-Werror", "-Os", "-fno-stack-protector", "-Wl,--gc-sections"
                abiFilters 'arm64-v8a'
            }
        }

        splits {
            abi {
                enable ((gradle.startParameter.taskNames.any { it.contains("Debug") } && splitAPKsForDebugBuilds == "1") ||
                    (gradle.startParameter.taskNames.any { it.contains("Release") } && splitAPKsForReleaseBuilds == "1"))
                reset ()
                include 'arm64-v8a'
                universalApk false
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        debug {
        }
    }

    compileOptions {
        // Flag to enable support for the new language APIs
        coreLibraryDesugaringEnabled true

        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    externalNativeBuild {
        ndkBuild {
            path "src/main/cpp/Android.mk"
        }
    }

    lint {
        disable 'ProtectedPermissions'
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            if (variant.buildType.name == "debug") {
                def abi = output.getFilter(com.android.build.OutputFile.ABI)
                outputFileName = new File("termux-app_" + (apkVersionTag ? apkVersionTag : project.ext.packageVariant + "-" + "debug") + "_" + (abi ? abi : "universal") + ".apk")
            } else if (variant.buildType.name == "release") {
                def abi = output.getFilter(com.android.build.OutputFile.ABI)
                outputFileName = new File("termux-app_" + (apkVersionTag ? apkVersionTag : project.ext.packageVariant + "-" + "release") + "_" + (abi ? abi : "universal") + ".apk")
            }
        }
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.17"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs_nio:2.1.5"
}

task versionName {
    doLast {
        print android.defaultConfig.versionName
    }
}

def validateVersionName(String versionName) {
    // https://semver.org/spec/v2.0.0.html#is-there-a-suggested-regular-expression-regex-to-check-a-semver-string
    // ^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$
    if (!java.util.regex.Pattern.matches("^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)(?:-((?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\\.(?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\\+([0-9a-zA-Z-]+(?:\\.[0-9a-zA-Z-]+)*))?\$", versionName))
        throw new GradleException("The versionName '"  + versionName + "' is not a valid version as per semantic version '2.0.0' spec in the format 'major.minor.patch(-prerelease)(+buildmetadata)'. https://semver.org/spec/v2.0.0.html.")
}

def patchBootstrapMotd(File zipFile) {
    File tempFile = new File(zipFile.parentFile, zipFile.name + ".motd.tmp")
    java.util.zip.ZipFile zf = new java.util.zip.ZipFile(zipFile)
    java.util.zip.ZipOutputStream zos = new java.util.zip.ZipOutputStream(new BufferedOutputStream(new FileOutputStream(tempFile)))

    Enumeration<? extends java.util.zip.ZipEntry> entries = zf.entries()
    byte[] buf = new byte[8192]
    boolean hasSetupMicrophone = false
    boolean hasTermuxX11 = false
    boolean hasTermuxX11Pref = false
    String trSetupMicrophone = "#!/data/data/com.termux/files/usr/bin/bash\n\n" +
                               "if [ \"\$#\" != \"0\" ]; then\n" +
                               "\techo 'kullanım: termux-setup-microphone'\n" +
                               "\techo 'Mikrofon izninin verildiğinden emin olmak için argümansız çalıştırın'\n" +
                               "\texit\n" +
                               "fi\n\n" +
                               "case \"\${TERMUX__USER_ID:-}\" in ''|*[!0-9]*|0[0-9]*) TERMUX__USER_ID=0;; esac\n\n" +
                               "am broadcast --user \"\$TERMUX__USER_ID\" \\\n" +
                               "\t-a \"com.termux.app.request_microphone_permission\" \\\n" +
                               "\t \"com.termux\" > /dev/null\n"
    String termuxX11Script = "#!/data/data/com.termux/files/usr/bin/bash\n" +
                             "if [ ! -e /system/bin/getprop ] || [ ! -e /system/bin/app_process ]; then\n" +
                             "  echo \"Headless system detected. Termux:X11 requires standard Android to work.\"\n" +
                             "  exit 1\n" +
                             "fi\n" +
                             "if [ \"\$(getprop ro.build.version.sdk)\" -lt \"24\" ]; then\n" +
                             "  echo \"Termux:X11 requires at least Android 7 or newer.\"\n" +
                             "  exit 1\n" +
                             "fi\n" +
                             "[ -z \"\${LD_LIBRARY_PATH+x}\" ] || export XSTARTUP_LD_LIBRARY_PATH=\"\$LD_LIBRARY_PATH\"\n" +
                             "[ -z \"\${LD_PRELOAD+x}\" ] || export XSTARTUP_LD_PRELOAD=\"\$LD_PRELOAD\"\n" +
                             "[ -z \"\${CLASSPATH+x}\" ] || export XSTARTUP_CLASSPATH=\"\$CLASSPATH\"\n" +
                             "APK_PATH=\"/data/data/com.termux/files/usr/libexec/termux-x11/base.apk\"\n" +
                             "if [ ! -e \"\$APK_PATH\" ]; then\n" +
                             "  APK_PATH=\"\$(/system/bin/pm path com.termux 2>/dev/null | head -n 1 | cut -d: -f2)\"\n" +
                             "fi\n" +
                             "export CLASSPATH=\"\$APK_PATH\"\n" +
                             "unset LD_LIBRARY_PATH LD_PRELOAD\n" +
                             "[ -n \"\$(trap -p USR1)\" ] && export TERMUX_X11_NOTIFY_PARENT=1\n" +
                             "exec /system/bin/app_process -Xnoimage-dex2oat / --nice-name=\"termux-x11 com.termux \$*\" com.termux.x11.CmdEntryPoint \"\$@\"\n"
    String termuxX11PrefScript = "#!/data/data/com.termux/files/usr/bin/bash\n" +
                                 "if [ ! -e /system/bin/getprop ] || [ ! -e /system/bin/app_process ]; then\n" +
                                 "  echo \"Headless system detected. Termux:X11 requires standard Android to work.\"\n" +
                                 "  exit 1\n" +
                                 "fi\n" +
                                 "if [ \"\$(getprop ro.build.version.sdk)\" -lt \"24\" ]; then\n" +
                                 "  echo \"Termux:X11 requires at least Android 7 or newer.\"\n" +
                                 "  exit 1\n" +
                                 "fi\n" +
                                 "if [ \"\$(getprop ro.build.version.sdk)\" -ge \"34\" ]; then\n" +
                                 "  unset LD_LIBRARY_PATH LD_PRELOAD\n" +
                                 "  APK_PATH=\"/data/data/com.termux/files/usr/libexec/termux-x11/base.apk\"\n" +
                                 "  if [ ! -e \"\$APK_PATH\" ]; then\n" +
                                 "    APK_PATH=\"\$(/system/bin/pm path com.termux 2>/dev/null | head -n 1 | cut -d: -f2)\"\n" +
                                 "  fi\n" +
                                 "  export CLASSPATH=\"\$APK_PATH\"\n" +
                                 "  exec /system/bin/app_process -Xnoimage-dex2oat / com.termux.x11.LoriePreferences\\\$Receiver \"\$@\"\n" +
                                 "fi\n\n" +
                                 "COMMAND=(\"am\" \"broadcast\" \"-a\" \"com.termux.x11.CHANGE_PREFERENCE\" \"-p\" \"com.termux\")\n" +
                                 "help() {\n  echo \"\$0 [list] {key:value} [{key2:value2}]...\"\n  exit 1\n}\n" +
                                 "if [ \$# -eq 0 ]; then help; fi\n" +
                                 "if [ \"\$1\" = \"list\" ]; then\n" +
                                 "  \"\${COMMAND[@]}\" -e list null\n" +
                                 "  exit \$?\n" +
                                 "fi\n" +
                                 "for arg in \"\$@\"; do\n" +
                                 "  COMMAND+=(\"-e\" \"\${arg%%:*}\" \"\${arg#*:}\")\n" +
                                 "done\n" +
                                 "\"\${COMMAND[@]}\"\n"
    while (entries.hasMoreElements()) {
        java.util.zip.ZipEntry entry = entries.nextElement()
        InputStream is = zf.getInputStream(entry)
        ByteArrayOutputStream baos = new ByteArrayOutputStream()
        int n
        while ((n = is.read(buf)) != -1) {
            baos.write(buf, 0, n)
        }
        is.close()
        byte[] data = baos.toByteArray()

        if (!entry.isDirectory() && entry.name.endsWith("etc/motd")) {
            String trMotd = "\033[1;34m╔════════════════════════════════════════════════════════╗\n" +
                            "║              MODERN TERMUX'A HOŞ GELDİN!               ║\n" +
                            "╚════════════════════════════════════════════════════════╝\033[0m\n\n" +
                            " Paket aramak için:          \033[1;32mpkg search <sorgu>\033[0m\n" +
                            " Paket kurmak için:          \033[1;32mpkg install <paket>\033[0m\n" +
                            " Paketleri güncellemek için: \033[1;32mpkg upgrade\033[0m\n" +
                            " Sistem bilgisi:             \033[1;32mtermux-info\033[0m\n\n" +
                            " Topluluk & Destek: https://github.com/Furkan00487/modern-termux\n\n"
            data = trMotd.getBytes(java.nio.charset.StandardCharsets.UTF_8)
        } else if (!entry.isDirectory() && entry.name.endsWith("bin/termux-setup-storage")) {
            String trSetupStorage = "#!/data/data/com.termux/files/usr/bin/bash\n\n" +
                                    "if [ \"\$#\" != \"0\" ]; then\n" +
                                    "\techo 'kullanım: termux-setup-storage'\n" +
                                    "\techo 'Depolama izninin verildiğinden ve \$HOME/storage altında sembolik'\n" +
                                    "\techo 'bağlantıların hazır olduğundan emin olmak için argümansız çalıştırın'\n" +
                                    "\texit\n" +
                                    "fi\n\n" +
                                    "if [ -d \"/data/data/com.termux/files/home/storage\" ]; then\n" +
                                    "\tcat <<- EOF\n\n" +
                                    "\t'~/storage' dizini zaten mevcut görünüyor.\n" +
                                    "\tBu betik, yapısını sıfırdan yeniden oluşturacak ve\n" +
                                    "\tbağlantısı kopmuş tüm geçersiz dosyaları temizleyecektir.\n" +
                                    "\tGerçek depolama içeriğiniz KESİNLİKLE SİLİNMEYECEKTİR.\n\n" +
                                    "\tEOF\n" +
                                    "\tread -re -p \"Devam etmek istiyor musunuz? (e/h) \" CHOICE\n\n" +
                                    "\tif ! [[ \"\${CHOICE}\" =~ ^[eEyY] ]]; then\n" +
                                    "\t\techo \"Yapılandırma iptal edildi ve '~/storage' dizinine dokunulmadı.\"\n" +
                                    "\t\texit 1\n" +
                                    "\tfi\n" +
                                    "fi\n\n" +
                                    "case \"\${TERMUX__USER_ID:-}\" in ''|*[!0-9]*|0[0-9]*) TERMUX__USER_ID=0;; esac\n\n" +
                                    "am broadcast --user \"\$TERMUX__USER_ID\" \\\n" +
                                    "\t-a \"com.termux.app.reload_style\" \\\n" +
                                    "\t--es \"com.termux.app.reload_style\" \"storage\" \\\n" +
                                    "\t \"com.termux\" > /dev/null\n"
            data = trSetupStorage.getBytes(java.nio.charset.StandardCharsets.UTF_8)
        } else if (!entry.isDirectory() && entry.name.endsWith("bin/termux-setup-microphone")) {
            hasSetupMicrophone = true
            data = trSetupMicrophone.getBytes(java.nio.charset.StandardCharsets.UTF_8)
        } else if (!entry.isDirectory() && entry.name.endsWith("bin/termux-x11")) {
            hasTermuxX11 = true
            data = termuxX11Script.getBytes(java.nio.charset.StandardCharsets.UTF_8)
        } else if (!entry.isDirectory() && entry.name.endsWith("bin/termux-x11-preference")) {
            hasTermuxX11Pref = true
            data = termuxX11PrefScript.getBytes(java.nio.charset.StandardCharsets.UTF_8)
        }

        java.util.zip.ZipEntry newEntry = new java.util.zip.ZipEntry(entry.name)
        newEntry.time = entry.time
        zos.putNextEntry(newEntry)
        zos.write(data)
        zos.closeEntry()
    }
    if (!hasSetupMicrophone) {
        java.util.zip.ZipEntry micEntry = new java.util.zip.ZipEntry("bin/termux-setup-microphone")
        zos.putNextEntry(micEntry)
        zos.write(trSetupMicrophone.getBytes(java.nio.charset.StandardCharsets.UTF_8))
        zos.closeEntry()
    }
    if (!hasTermuxX11) {
        java.util.zip.ZipEntry x11Entry = new java.util.zip.ZipEntry("bin/termux-x11")
        zos.putNextEntry(x11Entry)
        zos.write(termuxX11Script.getBytes(java.nio.charset.StandardCharsets.UTF_8))
        zos.closeEntry()
    }
    if (!hasTermuxX11Pref) {
        java.util.zip.ZipEntry x11PrefEntry = new java.util.zip.ZipEntry("bin/termux-x11-preference")
        zos.putNextEntry(x11PrefEntry)
        zos.write(termuxX11PrefScript.getBytes(java.nio.charset.StandardCharsets.UTF_8))
        zos.closeEntry()
    }

    // Download and bundle xkeyboard-config (share/xkeyboard-config-2) so X11 works offline without external packages
    File xkbDebFile = new File(projectDir, "src/main/cpp/xkeyboard-config_2.49_all.deb")
    if (!xkbDebFile.exists()) {
        String xkbUrl = "https://packages-cf.termux.dev/apt/termux-main/pool/main/x/xkeyboard-config/xkeyboard-config_2.49_all.deb"
        logger.quiet("Downloading " + xkbUrl + " ...")
        xkbDebFile.parentFile.mkdirs()
        new URL(xkbUrl).withInputStream { i -> xkbDebFile.withOutputStream { it << i } }
    }
    File assetsDir = new File(projectDir, "src/main/assets")
    assetsDir.mkdirs()
    File xkbAssetZip = new File(assetsDir, "xkb.zip")
    java.util.zip.ZipOutputStream xkbAssetZos = new java.util.zip.ZipOutputStream(new BufferedOutputStream(new FileOutputStream(xkbAssetZip)))
    def arIn = new org.apache.commons.compress.archivers.ar.ArArchiveInputStream(new BufferedInputStream(new FileInputStream(xkbDebFile)))
    def arEntry
    while ((arEntry = arIn.nextEntry) != null) {
        if (arEntry.name == "data.tar.xz") {
            def xzIn = new org.apache.commons.compress.compressors.xz.XZCompressorInputStream(arIn)
            def tarIn = new org.apache.commons.compress.archivers.tar.TarArchiveInputStream(xzIn)
            def tarEntry
            String prefixToStrip = "./data/data/com.termux/files/usr/"
            while ((tarEntry = tarIn.nextEntry) != null) {
                if (!tarEntry.isDirectory() && tarEntry.name.startsWith(prefixToStrip + "share/")) {
                    String relName = tarEntry.name.substring(prefixToStrip.length())
                    ByteArrayOutputStream tbaos = new ByteArrayOutputStream()
                    int tn
                    while ((tn = tarIn.read(buf)) != -1) {
                        tbaos.write(buf, 0, tn)
                    }
                    byte[] tbytes = tbaos.toByteArray()

                    java.util.zip.ZipEntry ze1 = new java.util.zip.ZipEntry(relName)
                    zos.putNextEntry(ze1)
                    zos.write(tbytes)
                    zos.closeEntry()

                    java.util.zip.ZipEntry ze2 = new java.util.zip.ZipEntry(relName)
                    xkbAssetZos.putNextEntry(ze2)
                    xkbAssetZos.write(tbytes)
                    xkbAssetZos.closeEntry()
                }
            }
            break
        }
    }
    arIn.close()
    xkbAssetZos.close()

    zos.close()
    zf.close()
    zipFile.delete()
    if (!tempFile.renameTo(zipFile)) {
        throw new GradleException("Failed to rename patched bootstrap zip file")
    }
    logger.quiet("Patched bootstrap zip (" + zipFile.name + ") with custom Turkish MOTD banner, termux-setup-storage, termux-setup-microphone, termux-x11 and xkeyboard-config")
}

def downloadBootstrap(String arch, String expectedChecksum, String version) {
    def localUrl = "src/main/cpp/bootstrap-" + arch + ".zip"
    def file = new File(projectDir, localUrl)
    def patchedMarker = new File(projectDir, "src/main/cpp/bootstrap-" + arch + ".patched3")
    if (file.exists() && patchedMarker.exists()) {
        return
    }

    def digest = java.security.MessageDigest.getInstance("SHA-256")
    if (file.exists()) {
        def buffer = new byte[8192]
        def input = new FileInputStream(file)
        while (true) {
            def readBytes = input.read(buffer)
            if (readBytes < 0) break
            digest.update(buffer, 0, readBytes)
        }
        input.close()
        def checksum = new BigInteger(1, digest.digest()).toString(16)
        while (checksum.length() < 64) { checksum = "0" + checksum }
        if (checksum == expectedChecksum) {
            patchBootstrapMotd(file)
            patchedMarker.text = "patched"
            return
        } else {
            logger.quiet("Deleting old local file with wrong hash: " + localUrl + ": expected: " + expectedChecksum + ", actual: " + checksum)
            file.delete()
            patchedMarker.delete()
        }
    }

    def remoteUrl = "https://github.com/termux/termux-packages/releases/download/bootstrap-" + version + "/bootstrap-" + arch + ".zip"
    logger.quiet("Downloading " + remoteUrl + " ...")

    file.parentFile.mkdirs()
    def out = new BufferedOutputStream(new FileOutputStream(file))

    def connection = new URL(remoteUrl).openConnection()
    connection.setInstanceFollowRedirects(true)
    digest.reset()
    def digestStream = new java.security.DigestInputStream(connection.inputStream, digest)
    out << digestStream
    out.close()

    def checksum = new BigInteger(1, digest.digest()).toString(16)
    while (checksum.length() < 64) { checksum = "0" + checksum }
    if (checksum != expectedChecksum) {
        file.delete()
        throw new GradleException("Wrong checksum for " + remoteUrl + ": expected: " + expectedChecksum + ", actual: " + checksum)
    }

    patchBootstrapMotd(file)
    patchedMarker.text = "patched"
}

clean {
    doLast {
        def tree = fileTree(new File(projectDir, 'src/main/cpp'))
        tree.include 'bootstrap-*'
        tree.each { it.delete() }
    }
}

task downloadBootstraps() {
    doLast {
        def packageVariant = project.ext.packageVariant
        if (packageVariant == "apt-android-7") {
            def version = "2026.02.12-r1" + "%2B" + "apt.android-7"
            downloadBootstrap("aarch64", "ea2aeba8819e517db711f8c32369e89e7c52cee73e07930ff91185e1ab93f4f3", version)
        } else if (packageVariant == "apt-android-5") {
            def version = "2022.04.28-r6" + "%2B" + packageVariant
            downloadBootstrap("aarch64", "913609d439415c828c5640be1b0561467e539cb1c7080662decaaca2fb4820e7", version)
        } else {
            throw new GradleException("Unsupported TERMUX_PACKAGE_VARIANT \"" + packageVariant + "\"")
        }
    }
}

afterEvaluate {
    tasks.preBuild.dependsOn(downloadBootstraps)
    android.applicationVariants.all { variant ->
        variant.javaCompileProvider.get().dependsOn(downloadBootstraps)
    }
}
