buildscript {
    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.13.2"
        classpath "org.bouncycastle:bcprov-jdk18on:1.86"
        classpath "org.bouncycastle:bcpkix-jdk18on:1.86"
        classpath "io.netty:netty-codec-http2:4.2.19.Final"
        classpath "io.netty:netty-handler:4.2.19.Final"
        classpath "io.netty:netty-handler-proxy:4.2.19.Final"
        classpath "org.bitbucket.b_c:jose4j:0.9.7"
        classpath "org.jdom:jdom2:2.0.6.1"
        classpath "com.google.protobuf:protobuf-java:4.36.2"
        classpath "com.google.protobuf:protobuf-kotlin:4.36.2"
        classpath "org.apache.commons:commons-compress:1.28.0"
        classpath "org.apache.commons:commons-lang3:3.21.0"
    }
    configurations.classpath {
        resolutionStrategy {
            force "org.bouncycastle:bcprov-jdk18on:1.86"
            force "org.bouncycastle:bcpkix-jdk18on:1.86"
            force "io.netty:netty-codec:4.2.19.Final"
            force "io.netty:netty-codec-http:4.2.19.Final"
            force "io.netty:netty-codec-http2:4.2.19.Final"
            force "io.netty:netty-handler:4.2.19.Final"
            force "io.netty:netty-handler-proxy:4.2.19.Final"
            force "org.bitbucket.b_c:jose4j:0.9.7"
            force "org.jdom:jdom2:2.0.6.1"
            force "com.google.protobuf:protobuf-java:4.36.2"
            force "com.google.protobuf:protobuf-kotlin:4.36.2"
            force "org.apache.commons:commons-compress:1.28.0"
            force "org.apache.commons:commons-lang3:3.21.0"
        }
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
    }
    configurations.all {
        resolutionStrategy {
            force "org.bouncycastle:bcprov-jdk18on:1.86"
            force "org.bouncycastle:bcpkix-jdk18on:1.86"
            force "io.netty:netty-codec:4.2.19.Final"
            force "io.netty:netty-codec-http:4.2.19.Final"
            force "io.netty:netty-codec-http2:4.2.19.Final"
            force "io.netty:netty-handler:4.2.19.Final"
            force "io.netty:netty-handler-proxy:4.2.19.Final"
            force "org.bitbucket.b_c:jose4j:0.9.7"
            force "org.jdom:jdom2:2.0.6.1"
            force "com.google.protobuf:protobuf-java:4.36.2"
            force "com.google.protobuf:protobuf-kotlin:4.36.2"
            force "org.apache.commons:commons-compress:1.28.0"
            force "org.apache.commons:commons-lang3:3.21.0"
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
