buildscript {
    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.13.2"
        classpath "org.bouncycastle:bcprov-jdk18on:1.85"
        classpath "io.netty:netty-codec-http2:4.1.137.Final"
        classpath "io.netty:netty-handler:4.1.137.Final"
    }
    configurations.classpath {
        resolutionStrategy {
            force "org.bouncycastle:bcprov-jdk18on:1.85"
            force "io.netty:netty-codec:4.1.137.Final"
            force "io.netty:netty-codec-http:4.1.137.Final"
            force "io.netty:netty-codec-http2:4.1.137.Final"
            force "io.netty:netty-handler:4.1.137.Final"
        }
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
    }
    configurations.all {
        resolutionStrategy {
            force "org.bouncycastle:bcprov-jdk18on:1.85"
            force "io.netty:netty-codec:4.1.137.Final"
            force "io.netty:netty-codec-http:4.1.137.Final"
            force "io.netty:netty-codec-http2:4.1.137.Final"
            force "io.netty:netty-handler:4.1.137.Final"
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
