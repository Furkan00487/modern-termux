buildscript {
    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.13.2"
        classpath "org.bouncycastle:bcprov-jdk18on:1.85"
        classpath "org.bouncycastle:bcpkix-jdk18on:1.85"
        classpath "io.netty:netty-codec-http2:4.1.137.Final"
        classpath "io.netty:netty-handler:4.1.137.Final"
        classpath "io.netty:netty-handler-proxy:4.1.137.Final"
        classpath "org.bitbucket.b_c:jose4j:0.9.6"
        classpath "org.jdom:jdom2:2.0.6.1"
        classpath "com.google.protobuf:protobuf-java:3.25.5"
        classpath "com.google.protobuf:protobuf-kotlin:3.25.5"
        classpath "org.apache.commons:commons-compress:1.26.2"
    }
    configurations.classpath {
        resolutionStrategy {
            force "org.bouncycastle:bcprov-jdk18on:1.85"
            force "org.bouncycastle:bcpkix-jdk18on:1.85"
            force "io.netty:netty-codec:4.1.137.Final"
            force "io.netty:netty-codec-http:4.1.137.Final"
            force "io.netty:netty-codec-http2:4.1.137.Final"
            force "io.netty:netty-handler:4.1.137.Final"
            force "io.netty:netty-handler-proxy:4.1.137.Final"
            force "org.bitbucket.b_c:jose4j:0.9.6"
            force "org.jdom:jdom2:2.0.6.1"
            force "com.google.protobuf:protobuf-java:3.25.5"
            force "com.google.protobuf:protobuf-kotlin:3.25.5"
            force "org.apache.commons:commons-compress:1.26.2"
        }
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
    }
    configurations.all {
        resolutionStrategy {
            force "org.bouncycastle:bcprov-jdk18on:1.85"
            force "org.bouncycastle:bcpkix-jdk18on:1.85"
            force "io.netty:netty-codec:4.1.137.Final"
            force "io.netty:netty-codec-http:4.1.137.Final"
            force "io.netty:netty-codec-http2:4.1.137.Final"
            force "io.netty:netty-handler:4.1.137.Final"
            force "io.netty:netty-handler-proxy:4.1.137.Final"
            force "org.bitbucket.b_c:jose4j:0.9.6"
            force "org.jdom:jdom2:2.0.6.1"
            force "com.google.protobuf:protobuf-java:3.25.5"
            force "com.google.protobuf:protobuf-kotlin:3.25.5"
            force "org.apache.commons:commons-compress:1.26.2"
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
