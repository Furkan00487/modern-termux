name: Sync Keystore Secrets to Advanced Repo

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync Secrets to Advanced Repo
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
          TARGET_REPO: Furkan00487/modern-termux-advanced
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          echo "Setting KEYSTORE_BASE64 in $TARGET_REPO..."
          echo "$KEYSTORE_BASE64" | gh secret set KEYSTORE_BASE64 --repo "$TARGET_REPO"

          echo "Setting KEYSTORE_PASSWORD in $TARGET_REPO..."
          echo "$KEYSTORE_PASSWORD" | gh secret set KEYSTORE_PASSWORD --repo "$TARGET_REPO"

          echo "Setting KEYSTORE_ALIAS in $TARGET_REPO..."
          echo "$KEYSTORE_ALIAS" | gh secret set KEYSTORE_ALIAS --repo "$TARGET_REPO"

          echo "Sync completed successfully!"
