name: Attach Release APKs To Release

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  attach-apks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package_variant: [ apt-android-7 ]
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Clone repository
        uses: actions/checkout@v7
        with:
          ref: ${{ env.GITHUB_REF }}
          submodules: recursive

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build and attach Release APKs to release
        shell: bash {0}
        env:
          PACKAGE_VARIANT: ${{ matrix.package_variant }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          exit_on_error() {
              echo "$1"
              echo "Failed to build or attach release APKs for '$RELEASE_VERSION_NAME'"
              exit 1
          }

          echo "Setting vars"
          RELEASE_VERSION_NAME="${GITHUB_REF/refs\/tags\//}"
          if ! printf "%s" "${RELEASE_VERSION_NAME/v/}" | grep -qP '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$'; then
           exit_on_error "The versionName '${RELEASE_VERSION_NAME/v/}' is not a valid version as per semantic version '2.0.0' spec in the format 'major.minor.patch(-prerelease)(+buildmetadata)'. https://semver.org/spec/v2.0.0.html."
          fi

          APK_DIR_PATH="./app/build/outputs/apk/release"
          APK_VERSION_TAG="$RELEASE_VERSION_NAME-${{ env.PACKAGE_VARIANT }}-github-release"
          APK_BASENAME_PREFIX="termux-app_$APK_VERSION_TAG"

          echo "Building Release APKs for '$APK_VERSION_TAG' (arm64-v8a)"
          export TERMUX_APP_VERSION_NAME="${RELEASE_VERSION_NAME/v/}"
          export TERMUX_APK_VERSION_TAG="$APK_VERSION_TAG"
          export TERMUX_PACKAGE_VARIANT="${{ env.PACKAGE_VARIANT }}"
          chmod +x ./gradlew
          if ! ./gradlew downloadBootstraps assembleRelease; then
            exit_on_error "Build failed for '$APK_VERSION_TAG' release."
          fi

          echo "Validating APK in $APK_DIR_PATH"
          for abi in arm64-v8a; do
            if ! test -f "$APK_DIR_PATH/${APK_BASENAME_PREFIX}_$abi.apk"; then
              unsigned_apk="$(find "$APK_DIR_PATH" -name "*$abi*.apk" | head -n 1)"
              if [ -n "$unsigned_apk" ] && [ "$unsigned_apk" != "$APK_DIR_PATH/${APK_BASENAME_PREFIX}_$abi.apk" ]; then
                echo "Renaming $unsigned_apk to $APK_DIR_PATH/${APK_BASENAME_PREFIX}_$abi.apk"
                mv "$unsigned_apk" "$APK_DIR_PATH/${APK_BASENAME_PREFIX}_$abi.apk"
              fi
            fi
            if ! test -f "$APK_DIR_PATH/${APK_BASENAME_PREFIX}_$abi.apk"; then
              files_found="$(ls "$APK_DIR_PATH")"
              exit_on_error "Failed to find built APK at '$APK_DIR_PATH/${APK_BASENAME_PREFIX}_$abi.apk'. Files found: "$'\n'"$files_found"
            fi
          done

          echo "Signing Release APK with custom private keystore from GitHub Secrets"
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release.p12
          APKSIGNER=$(find $ANDROID_SDK_ROOT/build-tools -name apksigner | sort -V | tail -n 1)
          echo "Found apksigner at: $APKSIGNER"

          ACTUAL_ALIAS="$KEYSTORE_ALIAS"
          DETECTED_ALIAS=$(keytool -list -keystore /tmp/release.p12 -storepass "$KEYSTORE_PASSWORD" -storetype PKCS12 2>/dev/null | grep -E 'PrivateKeyEntry|trustedCertEntry' | head -n 1 | cut -d, -f1 | cut -d' ' -f1)
          if [ -n "$DETECTED_ALIAS" ]; then
            ACTUAL_ALIAS="$DETECTED_ALIAS"
          fi
          echo "Using keystore alias: $ACTUAL_ALIAS"

          $APKSIGNER sign --ks /tmp/release.p12 \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$ACTUAL_ALIAS" \
            --key-pass "pass:$KEYSTORE_PASSWORD" \
            --v1-signing-enabled false \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            "$APK_DIR_PATH/${APK_BASENAME_PREFIX}_arm64-v8a.apk"
          rm -f /tmp/release.p12

          echo "Verifying Release signature with apksigner"
          $APKSIGNER verify --verbose "$APK_DIR_PATH/${APK_BASENAME_PREFIX}_arm64-v8a.apk"

          echo "Generating sha256sums file"
          if ! (cd "$APK_DIR_PATH"; sha256sum \
            "${APK_BASENAME_PREFIX}_arm64-v8a.apk" \
            > "${APK_BASENAME_PREFIX}_sha256sums"); then
            exit_on_error "Generate sha256sums failed for '$APK_VERSION_TAG' release."
          fi

          echo "Attaching Release APK to GitHub Release"
          if ! gh release upload "$RELEASE_VERSION_NAME" \
            "$APK_DIR_PATH/${APK_BASENAME_PREFIX}_arm64-v8a.apk" \
            "$APK_DIR_PATH/${APK_BASENAME_PREFIX}_sha256sums" \
            --clobber \
          ; then
            exit_on_error "Attach Release APK to release failed for '$APK_VERSION_TAG'."
          fi
