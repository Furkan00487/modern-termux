version: 2
updates:
  # ☕ Gradle bağımlılıkları ve Gradle Wrapper güncellemeleri
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 6 */2 * *"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "Changed"
    groups:
      gradle-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # 🤖 GitHub Actions iş akışları (workflows) güncellemeleri
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 6 */2 * *"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "Changed"
    groups:
      github-actions:
        patterns:
          - "*"

  # 🐳 Devcontainer yapılandırma ve özellik güncellemeleri
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 6 */2 * *"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "Changed"
